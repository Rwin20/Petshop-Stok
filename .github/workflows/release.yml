name: Build and Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install macOS native dependencies for canvas
        if: matrix.os == 'macos-latest'
        run: brew install pkg-config cairo pango libpng jpeg giflib librsvg

      - name: Install Dependencies
        run: npm install

      - name: Build Vite Frontend
        run: npm run build:vite

      - name: Build & Publish Electron App
        uses: samuelmeuli/action-electron-builder@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build_script_name: false
          release: true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yemmama-stok-${{ matrix.os }}
          path: |
            dist-electron/*.exe
            dist-electron/*.dmg
            dist-electron/*.zip
            release/*.exe
            release/*.dmg
            release/*.zip
            dist/*.exe
            dist/*.dmg
